name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run type check
        run: bun run typecheck

      - name: Test source and production parity
        run: bun test

      - name: Verify deployment baseline
        run: python3 deployment/verify.py --git

      - name: Build
        run: bun run build --out-dir /tmp/fsd-candidate
