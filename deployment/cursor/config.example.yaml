# Rendered by install.py; the real config stays outside this repository.
host: '127.0.0.1'
port: 8318
remote-management:
  allow-remote: false
  secret-key: ''
  disable-control-panel: true
auth-dir: '/var/lib/cursor-proxy/auth'
